schema_version = 2

[assistant]
name = "GonKenLab Agent"
language = "en"

[runtime]
mode = "offline"
interaction_mode = "wake_word"

[llm]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3:0.6b"
context_tokens = 2048
max_output_tokens = 96
keep_alive = "5m"

[audio]
input_match = "auto"
output_match = "auto"
capture_rate = 48000
processing_rate = 16000
speech_endpointing = true
speech_end_silence_ms = 900
speech_energy_threshold = 250

[stt]
model = "base.en-q5_1"
threads = 4

[tts]
voice = "en_US-ljspeech-medium"

[interaction]
push_to_talk_gpio = 17
recording_led_gpio = 27

[retrieval]
enabled = true
top_k = 3

[privacy]
raw_audio_retention = "delete"
interaction_logging = false
telemetry_content = false
dashboard_transient_content = false

[dashboard]
enabled = true
bind = "127.0.0.1"
port = 8080

[paths]
assets_dir = "/usr/local/lib/gonken-agent/current/share/gonken-agent/face"
state_dir = "/var/lib/gonken-agent"
cache_dir = "/var/cache/gonken-agent"
runtime_dir = "/run/gonken-agent"
corpus_dir = "/srv/gonken-agent/corpus"
whisper_binary = "/usr/local/bin/whisper-cli"
whisper_model = "/var/lib/gonken-agent/models/whisper/base.en-q5_1.bin"
piper_voice = "/var/lib/gonken-agent/models/piper/en_US-ljspeech-medium/en_US-ljspeech-medium.onnx"
local_prompt = "/usr/local/lib/gonken-agent/current/share/gonken-agent/local_soul.md"

[extensions.wake_word]
enabled = true
phrase = "GonKen"
model = ""
threshold = 0.5
monitoring_led_gpio = 22
# Streaming phonetic KWS; Whisper checks complete speech, never silent windows.
backend = "streaming"
keyword_threshold = 1e-20

[extensions.voice_power]
enabled = false

[extensions.environment]
enabled = false
sensor_backend = "sht31"
i2c_bus = 1
i2c_address = 0x44
sensor_repeatability = "high"
poll_interval_seconds = 2.0
stale_after_seconds = 10.0
valid_samples_to_recover = 3
relay_backend = "libgpiod"
relay_bcm = 23
relay_active_high = true
safe_state = "off"
socket_path = "/run/gonken-environment/control.sock"
policy_path = "/var/lib/gonken-environment/policy.json"
temperature_policy_min_c = -10.0
temperature_policy_max_c = 60.0
minimum_hysteresis_c = 0.5
maximum_hysteresis_c = 15.0
minimum_dwell_seconds = 5
maximum_dwell_seconds = 3600
simulation_runtime_control_enabled = false
simulation_event_history_limit = 128
