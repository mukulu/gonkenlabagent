[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gonkenlab-agent"
version = "0.2.0.dev0"
description = "Local, source-grounded Raspberry Pi AI-lab assistant"
readme = "README.md"
# Production is locked to CPython 3.13 on Trixie. Python 3.12 remains an
# explicit host-development target so clean x86 validation does not need to
# bypass package metadata.
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
# Optional display support is deliberately outside the headless core. Accepted
# installs consume the matching hash-locked profile under requirements/.
ui = ["pygame==2.6.1"]

# Deliberately no project.license field: D-050 grants no project license and
# prohibits redistribution. See docs/development/LICENSE_PROVENANCE.md.

[project.scripts]
gonken-agent = "gonken_agent.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.data-files]
"share/gonken-agent" = ["config/defaults.toml", "config/local_soul.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gonken_agent", "gonken_agent.*"]
